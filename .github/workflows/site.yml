name: Site and videos

# Builds the site, renders new or changed videos (unchanged ones come from the cache)
# and publishes everything on GitHub Pages: https://amirkallas2cs-gif.github.io
on:
  push:
    branches: [main]
    paths-ignore: ["marketing/engage/**", ".github/workflows/engage.yml", "marketing/published.json", "marketing/status.json", "marketing/schedule.json", "marketing/publish/**", ".github/workflows/publish.yml"]
  schedule:
    - cron: "13 4 * * *"
    - cron: "52 16 * * *"  # after the 17:30 post, so the Pinterest feed picks it up the same day
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: marketing/video/requirements.txt }
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r marketing/video/requirements.txt markdown jinja2
          python -m playwright install --with-deps chromium
      - name: Rendered videos (cache)
        uses: actions/cache@v4
        with:
          path: build/media
          key: media-${{ github.run_id }}
          restore-keys: media-
      - name: Backup voice model (cache)
        uses: actions/cache@v4
        with: { path: .kokoro, key: kokoro-v1.0 }
      - name: Backup voice model
        run: |
          mkdir -p .kokoro && cd .kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f kokoro-v1.0.onnx ] || curl -sSfL -o kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -sSfL -o voices-v1.0.bin $base/voices-v1.0.bin
      - name: Videos and pins
        run: |
          set -o pipefail
          python marketing/render_all.py build/media --jobs 2 2>&1 | tee build/render_log.txt
          ls -la build/media | tee -a build/render_log.txt
          # Results as run annotations, readable from the API without downloading logs.
          python -c "import json,pathlib;m=pathlib.Path('build/media');idx=json.loads((m/'index.json').read_text());[print(f'::notice title=video {k}::{v.get(\"status\")} {v.get(\"seconds\")}s voice={v.get(\"engines\")} problems={v.get(\"problems\")}') for k,v in idx.items() if v.get('status')=='rendered' or k.startswith('v1')];[print(f'::warning title=video failed {f[\"id\"]}::'+f['error'][-400:].replace(chr(10),' | ')) for f in json.loads((m/'failed.json').read_text())]"
      - name: Site
        run: |
          python site/build.py build/site
          mkdir -p build/site/media && cp build/media/*.mp4 build/media/*.jpg build/media/index.json build/media/failed.json build/site/media/ 2>/dev/null || true
          cp build/render_log.txt build/site/media/render_log.txt
          python site/tests/site_test.py build/site
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/site }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
